<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NHNCD — Be Enhanced by AI.</title>
  <meta name="description" content="NHNCD — Strategic advisory and integration partner for AI adoption. Launching soon.">
  <meta property="og:title" content="NHNCD — Be Enhanced by AI.">
  <meta property="og:description" content="Strategic advisory and integration partner for AI adoption.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://nhncd.ai">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon_32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon_16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon_180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --ink: #14181A;
      --off-white: #F4F2EC;
      --oxblood: #7E2632;
      --oxblood-bright: #CC5F73;
      --gold: #B8862F;
    }

    html { height: 100%; }

    body {
      min-height: 100vh;
      background-color: var(--ink);
      color: var(--off-white);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-weight: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .content {
      text-align: center;
      max-width: 600px;
      animation: fadeIn 1.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-group {
      width: min(380px, 80vw);
      margin: 0 auto 2rem;
    }

    .mark {
      display: block;
      width: min(64px, 14vw);
      height: auto;
      margin: 0 auto 1.5rem;
      position: relative;
      right: 3.75%;
    }

    .wordmark {
      display: block;
      width: 100%;
      height: auto;
    }

    .tagline {
      font-size: clamp(1.125rem, 2.5vw, 1.375rem);
      font-weight: 300;
      letter-spacing: 0.04em;
      color: var(--off-white);
      margin-bottom: 2.5rem;
    }

    .divider {
      width: 56px;
      height: 1px;
      background-color: var(--oxblood);
      margin: 0 auto 2.5rem;
    }

    .descriptor {
      font-size: clamp(0.875rem, 1.8vw, 1rem);
      font-weight: 300;
      letter-spacing: 0.02em;
      line-height: 1.7;
      color: rgba(244, 242, 236, 0.6);
      margin-bottom: 3.5rem;
    }

    .coming-soon {
      font-size: 0.8125rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(244, 242, 236, 0.35);
      margin-bottom: 4rem;
    }

    .contact {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .contact a {
      font-size: 0.875rem;
      font-weight: 300;
      color: rgba(244, 242, 236, 0.55);
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: color 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .contact a:hover {
      color: var(--oxblood-bright);
    }

    .contact .sep {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(244, 242, 236, 0.2);
      flex-shrink: 0;
    }

    .contact svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .footer {
      font-size: 0.6875rem;
      font-weight: 300;
      letter-spacing: 0.03em;
      color: rgba(244, 242, 236, 0.2);
    }

    @media (max-width: 480px) {
      body { padding: 2rem 1.25rem; }
      .logo-group { margin-bottom: 1.5rem; }
      .mark { margin-bottom: 1rem; }
      .tagline { margin-bottom: 2rem; }
      .divider { margin-bottom: 2rem; }
      .descriptor { margin-bottom: 2.5rem; }
      .coming-soon { margin-bottom: 3rem; }
      .contact { gap: 1rem; }
    }
  </style>
</head>
<body>
